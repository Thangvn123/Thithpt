<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EXAMO — Luyện thi & Học tập THPT</title>
  <meta name="description" content="EXAMO: làm đề thi thử, chấm điểm theo quy chế 2025, xếp hạng, bài giảng video và tài liệu học tập cho học sinh THPT." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700;7..72,800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>document.documentElement.dataset.theme = localStorage.getItem("ptt_theme") || "light";</script>
  <!-- MathJax: render công thức toán (phân số, căn, vector...) viết trong đề bằng cú pháp LaTeX \( ... \) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]]
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script" defer></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23A8730F'/><text x='50' y='68' font-size='48' text-anchor='middle' fill='white' font-family='Georgia'>E</text></svg>" />
</head>
<body>
  <!-- ======= MÀN HÌNH ĐĂNG NHẬP ======= -->
  <div id="auth-screen" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="auth-head">
        <p class="eyebrow">KỲ THI THỬ TỐT NGHIỆP THPT</p>
        <h1 class="auth-title">EXAMO</h1>
        <div class="red-rule"></div>
        <p class="auth-sub">Học bài giảng · Làm đề thi · Xem xếp hạng</p>
      </div>

      <div class="field">
        <label>Tên đăng nhập hoặc Email</label>
        <input id="auth-username" type="text" placeholder="vd: nguyenvana hoặc email" autocomplete="username" />
      </div>
      <div class="field">
        <label>Mật khẩu</label>
        <input id="auth-password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <p id="auth-success" class="success-box hidden"></p>
      <p id="auth-error" class="error-box hidden"></p>
      <button id="auth-resend" class="btn btn-outline btn-sm btn-block hidden" style="margin-bottom:12px">📧 Gửi lại email xác minh</button>
      <button id="auth-submit" class="btn btn-primary btn-block">Vào phòng thi</button>
      <p class="auth-hint">Chưa có tài khoản? Liên hệ quản trị viên để được cấp tài khoản.<br/>Tài khoản quản trị mặc định: <code>admin / admin123</code></p>
    </div>
  </div>

  <!-- ======= KHUNG ỨNG DỤNG ======= -->
  <div id="app-shell" class="hidden">
    <div id="drawer-overlay" class="drawer-overlay hidden"></div>
    <aside id="side-drawer" class="side-drawer">
      <div class="drawer-head">
        <div class="brand" id="brand-home">
          <div class="brand-mark">E</div>
          <div>
            <div class="brand-name">EXAMO <span class="brand-badge">PRO</span></div>
            <div class="brand-sub">Học & thi theo chuẩn THPT 2025 · <span id="db-badge"></span></div>
          </div>
        </div>
        <button id="drawer-close" class="dm-icon-btn" title="Đóng" aria-label="Đóng menu">✕</button>
      </div>
      <nav class="side-nav" id="main-nav">
        <button class="side-nav-btn" data-view="exams"><span class="side-nav-ic">🏠</span>Tổng quan</button>
        <button class="side-nav-btn" data-view="lessons"><span class="side-nav-ic">📚</span>Bài giảng</button>
        <button class="side-nav-btn" data-view="rank"><span class="side-nav-ic">📈</span>Xếp hạng</button>
        <button class="side-nav-btn" data-view="qa"><span class="side-nav-ic">💬</span>Hỏi bài <span id="qa-badge" class="nav-badge hidden">0</span></button>
        <button class="side-nav-btn" data-view="messages"><span class="side-nav-ic">✉️</span>Nhắn tin <span id="dm-badge" class="nav-badge hidden">0</span></button>
        <button class="side-nav-btn" data-view="profile"><span class="side-nav-ic">👤</span>Hồ sơ</button>
        <button class="side-nav-btn admin-only hidden" data-view="upload"><span class="side-nav-ic">⬆️</span>Tải lên</button>
        <button class="side-nav-btn admin-only hidden" data-view="admin"><span class="side-nav-ic">🛠️</span>Quản trị</button>
      </nav>
      <div class="drawer-stat" id="drawer-stat"></div>
    </aside>

    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <button id="hamburger-btn" class="hamburger-btn" title="Menu" aria-label="Mở menu">
            <span></span><span></span><span></span>
          </button>
          <span class="topbar-title" id="topbar-title">EXAMO</span>
        </div>
        <div class="user-box">
          <button id="notif-btn" class="notif-btn" title="Thông báo" aria-label="Thông báo">🔔<span id="notif-badge" class="notif-badge hidden"></span></button>
          <button id="profile-btn" class="user-profile-btn" title="Hồ sơ của tôi">
            <img id="user-avatar-topbar" class="user-avatar-mini hidden" alt="" />
            <span id="user-chip" class="user-chip"></span>
          </button>
          <button id="changepw-btn" class="btn btn-ghost btn-sm">🔑 Mật khẩu</button>
          <button id="logout-btn" class="btn btn-ghost btn-sm">Đăng xuất</button>
        </div>
      </div>
      <div id="notif-panel" class="notif-panel hidden"></div>
    </header>

    <main id="main" class="main"></main>

    <footer class="footer">
      <span>EXAMO · Chấm điểm theo quy chế thi tốt nghiệp THPT 2025</span>
    </footer>
  </div>

  <button id="theme-btn" class="theme-btn" title="Đổi giao diện sáng / tối" aria-label="Đổi giao diện sáng tối">🌙</button>
  <div id="toast" class="toast hidden"></div>
  <div id="modal-root"></div>

  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/exam-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
